server:
  port: 8080

spring:
  application:
    name: credit-scoring-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:credit_scoring}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:credituser}
    password: ${DB_PASSWORD:creditpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ML Service config
ml:
  service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 30

# File upload storage
upload:
  dir: ${UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.creditscore: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
